components:
  schemas:
    Service:
      description: Уязвимый сервис
      type: object
      required:
        - id 
        - name
        - link
        - port
        - plugins
      properties:
        id:
          type: string
          format: uuid
        name: 
          type: string
        link:
          type: string
        containerID:
          type: string
        port:
          type: integer
          format: uint16
        plugins:
          type: array
          items:
            type: string
            format: uuid

    Packet:
      description: запрос/ответ
      required:
        - sentAt
        - isRequest
        - payload
      properties:
        sentAt:
          type: string
          format: date-time
        isRequest:
          type: boolean
        payload:
          type: string

    Session:
      description: Сеанс обмена данными клиента и сервера
      type: object
      required:
        - id
        - sentAt
        - clientHost
        - serverPort
        - ttl
        - protocol
        - packets
        - packetsCount
        - requestsNumber
        - averageResponseTime
        - matchedFilters
      properties:
        id: 
          type: string
          format: uuid
        sentAt:
          type: string
          format: date-time
        clientHost:
          type: string
        serverPort:
          type: integer
          format: uint16
        ttl:
          type: integer
          format: uint8
        protocol:
          type: string
          example: tcp
        packets:
          type: array
          items: 
            $ref: "#/components/schemas/Packet"
        packetsCount:
          type: integer
        averageResponseTime:
          type: number
          format: double
        requestsNumber:
          type: integer
        matchedFilters:
          type: array
          items:
            $ref: "#/components/schemas/SessionFilter"
        clientUserAgent:
          type: string

    Workspace:
      description: Воркспейс с сеансами для анализа
      type: object
      required:
        - id
        - name
        - servicePort
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        servicePort:
          type: integer
          format: uint16
        status: 
          type: string
          enum:
            - LISTENING
            - WAITING
            - COMPLETED

    Plugin:
      description: Плагин с доп. функционалом
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Filter:
      description: Фильтр для сеанса
      type: object
      required:
        - id
        - name
        - inRequest
        - inResponse
        - isBlocking
        - color
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        regex:
          type: string
        ttl:
          type: integer
          format: uint8
        totalPackets:
          type: integer
        color:
          type: string
        inRequest:
          type: boolean
        inResponse:
          type: boolean
        isBlocking:
          type: boolean

    SessionFilter:
      allOf:
        - $ref: "#/components/schemas/Filter"
        - type: object
          required:
            - matchesCount
            - matchedPackets
            - sessionID
          properties:
            matchesCount:
              type: integer
            matchedPackets:
              type: array
              items:
                type: integer
            sessionID:
              type: string
              format: uuid

    Characteristic:
      required:
        - value
        - number
        - isSafe
      properties:
        value:
          type: string
        number:
          type: integer
        isSafe:
          type: boolean

    PcapWorkspace:
      type: object
      required:
        - id
        - fileName
        - status
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        status: 
          type: string
          enum:
            - LISTENING
            - COMPLETED

    AddPcapSessionRequest:
      type: object
      required:
        - session
      properties:
        session:
          $ref: "#/components/schemas/Session"

    ProcessSessionRequest:
      type: object
      required:
        - session
        - plugins
      properties:
        session:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        plugins:
          type: array
